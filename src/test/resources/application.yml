kestra:
  server-type: STANDALONE
  server:
    liveness:
      enabled: false
    termination-grace-period: 5s
    service:
      purge:
        initial-delay: 1h
        fixed-delay: 1d
        retention: 30d
  anonymous-usage-report:
    enabled: false
  repository:
    type: memory
  queue:
    type: memory
  storage:
    type: local
    local:
      base-path: /tmp/unittest
  controller:
    port: ${random.int[20000,32000]}
  worker:
    controllers:
      type: STATIC
      static:
        endpoints:
          - host: localhost
            port: ${kestra.controller.port}

grpc:
  server:
    enabled: false
    health:
      enabled: false
